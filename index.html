<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>怪物大師 · Monster Masters</title>
<meta name="description" content="Catch, raise and fuse 150 monsters with 4 colours each plus a hidden rainbow colour: 15 types, 200 skills, 10 areas and tamers to battle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1C4 1 2 5 2 9c0 3 2 6 6 6s6-3 6-6c0-4-2-8-6-8z' fill='%2378c850'/%3E%3Ccircle cx='6' cy='8' r='1.3'/%3E%3Ccircle cx='10' cy='8' r='1.3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div id="app">
  <header id="top"><button id="tBack" hidden>◀</button><h1 id="tTitle"></h1><span id="tGold"></span><button id="tSound">🔊</button><button id="tLang">EN</button><button id="tHelp">?</button></header>
  <main id="main"></main>
</div>

<section id="battle" hidden>
  <div class="scene">
    <div id="fInfo" class="info foe"></div>
    <div id="fSprite" class="spr"></div><div id="fFx" class="fx"></div>
    <div id="pSprite" class="spr"></div><div id="pFx" class="fx"></div>
    <div id="pInfo" class="info me"></div>
  </div>
  <div id="msg"></div>
  <div id="cmd"></div>
</section>

<div id="modal" hidden></div>
<div id="toast"></div>
<script type="module" src="js/main.js?v=1"></script>
<script src="/hub.js" data-pos="bottom-left" defer></script>
</body>
</html>
